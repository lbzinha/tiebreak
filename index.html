<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiebreak</title>
<meta name="description" content="Treinos de força, corrida e tênis, com registro no próprio celular.">
<meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tiebreak">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <section id="v-hoje" class="view" aria-label="Hoje"></section>
  <section id="v-semana" class="view" aria-label="Semana" hidden></section>
  <section id="v-historico" class="view" aria-label="Histórico" hidden></section>
  <section id="v-ajustes" class="view" aria-label="Ajustes" hidden></section>
  <p class="loading" id="loading">Carregando…</p>
</main>

<nav class="tabs" aria-label="Seções">
  <button type="button" data-tab="hoje" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M5.2 7.5c3.2 1.6 3.2 7.4 0 9M18.8 7.5c-3.2 1.6-3.2 7.4 0 9"/></svg>
    <span>Hoje</span>
  </button>
  <button type="button" data-tab="semana">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Semana</span>
  </button>
  <button type="button" data-tab="historico">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Histórico</span>
  </button>
  <button type="button" data-tab="ajustes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    <span>Ajustes</span>
  </button>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-bar">
      <button type="button" class="icon-btn" id="sheet-back" aria-label="Voltar" hidden>‹</button>
      <span class="grabber" aria-hidden="true"></span>
      <button type="button" class="icon-btn" data-close aria-label="Fechar">×</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="f-restaurar" accept="application/json,.json" hidden>
<input type="file" id="f-plano" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
